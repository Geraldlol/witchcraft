name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  addon:
    name: Addon (Lua 5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-check
      - run: luacheck Witchcraft
      - run: lua5.1 tests/witchcraft/run.lua

  daemon:
    name: Daemon (Node 24 on Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/witchcraft-daemon
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/witchcraft-daemon/package-lock.json
      - run: npm ci
      - run: python3 --version
      - run: npm test
