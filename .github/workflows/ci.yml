name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon:
    name: Addon (luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck
      - run: luacheck Witchcraft

  daemon:
    name: Daemon (node --test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/witchcraft-daemon
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/witchcraft-daemon/package-lock.json
      - run: npm ci
      - run: npm test
