name: Addon package

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: Verify addon ZIP
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify package checks
        run: python3 -B tests/test_release_package.py
      - name: Build candidate from the checked-out commit
        run: python3 tools/verify-release.py --tag "$RELEASE_TAG" --output-dir dist
      - name: Retain tagged candidate for manual publication
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Witchcraft-${{ github.ref_name }}
          path: dist/Witchcraft-*.zip
          if-no-files-found: error
          compression-level: 0
      - name: Verify the published release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="Witchcraft-${RELEASE_TAG#v}.zip"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir published
          python3 tools/verify-release.py --tag "$RELEASE_TAG" --output-dir dist --asset "published/$asset"
